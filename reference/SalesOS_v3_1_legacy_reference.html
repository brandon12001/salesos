/* === SalesOS v3.1: task-first Focus Mode ==================================== */
.sidebar-brandline{display:flex;align-items:flex-start;justify-content:space-between;gap:0}
.sidebar-brandline .brand{padding-left:13px;padding-right:0;min-width:0}
.sidebar-dismiss{margin-top:7px;flex:none;background:transparent;border:0;color:#91a5bf;border-radius:9px;padding:5px 8px;font-size:13px}
.sidebar-dismiss:hover{background:#223451;color:white}
.shell.nav-collapsed .sidebar,.shell.nav-collapsed .sidebar-backdrop{display:none}
.shell-execution{background:#0a1220;min-height:100vh}
.shell-execution .main{max-width:none;padding:0;margin:0;min-width:0;min-height:100vh}
.execution-view{min-height:100vh;padding:0 clamp(16px,3vw,44px) 24px;display:flex;flex-direction:column;background:radial-gradient(ellipse 660px 420px at 50% 30%,rgba(30,59,101,.105),transparent 100%)}
.execution-toolbar{height:75px;min-height:75px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1c2a3d;gap:12px}
.exec-brand-group,.exec-brand{display:flex;align-items:center;gap:14px}
.utility-menu{display:grid;place-items:center;background:#152236;border:1px solid #2a3b55;border-radius:10px;color:#c1d0e6;height:35px;width:39px;font-size:17px;flex:none}
.utility-menu:hover{background:#213a59;color:white}
.exec-brand{gap:9px;font-size:14px;color:#f2f7ff}
.exec-brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#2f69c5;color:white;font-size:20px;font-weight:800}
.exec-brand strong{font-size:18px;letter-spacing:-.65px}
.exec-brand strong span,.management-toolbar strong span{color:#7dafff}
.exec-slash{color:#4f6077;font-weight:300;margin:0 1px}
.exec-focus-label{color:#93aac7;font-size:13px;font-weight:600}
.exec-toolbar-actions{display:flex;gap:9px;align-items:center}
.exec-toolbar-btn{background:transparent;border:1px solid #2a3950;border-radius:9px;color:#a9bed9;font-size:12px;font-weight:650;padding:9px 12px}
.exec-toolbar-btn:hover,.exec-toolbar-btn.active{background:#203450;color:#eaf4ff;border-color:#3c6b9d}
.execution-main{width:min(100%,880px);margin:0 auto;display:flex;flex-direction:column;flex:1;padding:28px 0 0}

  `<div class="badge-row">${stageTag(l)} ${readinessTag(l)} ${tag('Fit '+l.fit+'/5')}</div><div class="profile-intro"><div><small>MAIN BARRIER</small><p>${esc(l.barrier||'Not established')}</p></div><div><small>NEXT BUYER MILESTONE</small><p>${esc(unmet(l))}</p></div><div><small>LAST PROGRESSION EVIDENCE</small><p>${esc(l.lastProgressEvidence||l.readinessEvidence||'None recorded')}</p></div></div><div class="button-row wrap">${btn('Edit company','editCompany','outline')}${l.status!=='Active'&&l.status!=='Take Me Off the List'&&!C.isSuppressed(state,l)?btn('Reopen opportunity','reopen','outline'):''}${btn('Buyer Readiness','readiness','outline')}${btn('Advance pipeline','stage','outline')}${btn('FX discovery','fx','outline')}${btn('Set outcome status','status','outline')}</div><div class="modal-section"><div class="card-head"><h3>People and contact methods</h3>${btn('＋ Add contact','addContact','ghost')}</div>${l.contacts.map(c=>`<div class="contact-card"><div><strong>${esc(c.name||'Unknown name')}</strong><p class="muted small">${esc(c.title||'Unspecified role')} · ${esc(c.roleStatus.replace('_',' '))} ${c.optedOut?' · OPTED OUT':''}</p>${c.methods.map(m=>`<div class="contact-method"><span>${esc(m.kind.toUpperCase())}: ${esc(m.value)} ${tag(m.status,m.status==='invalid'?'red':'muted')}</span>${m.status==='invalid'||c.optedOut?'':btn('Copy','copyMethod','tiny',`data-lead="${l.id}" data-contact="${c.id}" data-method="${m.id}"`)}${m.status!=='invalid'&&!c.optedOut&&['phone','mobile'].includes(m.kind)?btn('Mark invalid','invalidateMethod','text',`data-lead="${l.id}" data-contact="${c.id}" data-method="${m.id}"`):''}</div>`).join('')}</div>${btn('Edit','editContact','tiny',`data-contact="${c.id}"`)}</div>`).join('')||'<p class="muted">No people saved. Add the person responsible for FX.</p>'}</div><div class="metric-grid three">${stat('Annual FX discovered',GBP(p.discovered),'GBP-equivalent')}${stat('Qualified FX',GBP(p.qualified),'Annual addressable')}${stat('Revenue potential',GBP(p.revenue),'Annual estimate')}</div><div class="modal-section"><h3>Upcoming tasks</h3>${pending.map(t=>`<div class="detail-row"><span>${esc(t.title)}<small>${niceDate(t.dueAt)} ${esc(t.dueTime||'')}</small></span>${tag(t.type)}</div>`).join('')||'<p class="muted small">No pending tasks</p>'}${btn('Add task','manualTask','outline')}</div><div class="modal-section"><h3>Readiness change history</h3>${changes.map(x=>`<div class="history-item"><b>${x.from||'—'} → ${x.to} · ${esc(C.READINESS[x.to-1])}</b><span>${esc(new Date(x.at).toLocaleString('en-GB'))}</span><p>${esc(x.evidence)}</p></div>`).join('')||'<p class="muted small">No readiness changes recorded.</p>'}</div><div class="modal-section"><h3>Activity history</h3>${history.map(a=>`<div class="history-item"><b>${esc(a.type)} · ${esc(a.outcome)}</b><span>${esc(new Date(a.at).toLocaleString('en-GB'))}</span><p>${esc(a.notes||'No notes')}</p></div>`).join('')||'<p class="muted small">No activities yet.</p>'}</div>`,btn('Close','closeModal','primary'))}
function companyModal(edit=false){let l=edit?currLead():null;return wrapModal(edit?'Edit company':'Add a prospect','COMPANY RECORD',
 `${field('co_company','Company name',l?.company||'')}${field('co_sector','Sector',l?.sector||'')}${dropdown('co_fit','Prospect fit (1–5)',[1,2,3,4,5].map(x=>[x,`${x} / 5`]),l?.fit||3)}${field('co_notes','Company notes',l?.notes||'','textarea')}${edit?'':`<div class="modal-section"><h3>First contact (optional)</h3><div class="two-cols compact">${field('co_contact','Contact name')}${field('co_title','Title / role')}${field('co_mobile','Mobile')}${field('co_phone','Landline')}${field('co_email','Work email','email')}${field('co_linkedin','LinkedIn profile URL','url')}</div><p class="muted small">If contact details are missing, SalesOS will create a Contact Resolution task.</p></div>`}`,btn('Cancel','closeModal','ghost')+btn(edit?'Save company':'Create prospect','saveCompany','primary'))}
function contactModal(){let l=currLead(),c=editingContactId?C.getContact(l,editingContactId):null;let read=kind=>C.methods(c,kind).find(x=>x.status!=='invalid')?.value||'';return wrapModal(c?'Edit contact':'Add contact',l?.company||'CONTACT',
 `<div class="two-cols compact">${field('ct_name','Full name',c?.name||'')}${field('ct_title','Job title',c?.title||'')}${dropdown('ct_role','Relevance to FX',[['unknown','Not confirmed'],['decision_maker','FX decision-maker'],['not_responsible','Does not handle FX'],['left_company','Left company']],c?.roleStatus||'unknown')}${field('ct_mobile','Mobile',read('mobile'))}${field('ct_phone','Landline',read('phone'))}${field('ct_email','Work email',read('email'),'email')}${field('ct_linkedin','LinkedIn URL',read('linkedin'),'url')}</div><label class="check"><input id="ct_connected" type="checkbox" ${c?.linkedinConnected?'checked':''}> Already connected on LinkedIn</label>${field('ct_notes','Notes',c?.notes||'','textarea')}${c?.optedOut?'<div class="warning">This contact has opted out. Changing their details does not remove suppression.</div>':''}`,btn('Cancel','closeModal','ghost')+btn('Save contact','saveContact','primary'))}
function readinessModal(){let l=currLead();if(!l)return '';return wrapModal('Buyer Readiness',l.company,
 `<div class="info-card">Readiness measures willingness to buy, separately from the seven-stage acquisition pipeline. Calls and emails alone do not count as progression.</div><div class="badge-row">${readinessTag(l)} ${stageTag(l)}</div>${dropdown('rd_level','Confirmed buyer level',[['','Choose a level'],...C.READINESS.map((x,i)=>[i+1,`${i+1} — ${x}`])],l.readiness||'')}${field('rd_evidence','What did the prospect actually say or do? (required)', '', 'textarea','placeholder="Evidence, including reasons for regression"')}${field('rd_barrier','Main barrier to progress',l.barrier,'textarea')}${field('rd_milestone','Next milestone / condition to improve readiness',l.nextMilestone||C.NEXT_MILESTONES[(l.readiness||1)-1],'textarea')}<p class="muted small">You can move backwards when urgency, budget or support changes. Every confirmed change is timestamped and preserved.</p>`,btn('Cancel','closeModal','ghost')+btn('Confirm evidence-based change','saveReadiness','primary'))}
function stageModal(){let l=currLead();return wrapModal('Advance acquisition stage',l.company,
 `<div class="badge-row">${stageTag(l)} ${readinessTag(l)}</div>${dropdown('st_stage','Acquisition pipeline stage',C.STAGES,l.stage)}${field('st_evidence','What operational milestone actually happened?', '', 'textarea','placeholder="e.g. Meeting booked with CFO for Thursday"')}${field('st_nextDate','Next agreed date (optional)','', 'date')}${field('st_nextTime','Time (optional)','', 'time')}<div class="info-card">Changing stages will cancel obsolete sequence/stage tasks. Promised callbacks remain unless you explicitly cancel them. Buyer Readiness does not change automatically.</div>`,btn('Cancel','closeModal','ghost')+btn('Save stage','saveStage','primary'))}
function reopenModal(){let l=currLead();return wrapModal('Reopen opportunity',l.company,`${dropdown('reopen_stage','Return to acquisition stage',C.STAGES.filter(x=>x!=='First Trade'),'Prospecting')}${field('reopen_reason','Why is this opportunity now viable again?', '', 'textarea')}<div class="info-card">Earlier readiness and activity history will remain intact. New buyer evidence can be recorded separately.</div>`,btn('Cancel','closeModal','ghost')+btn('Reopen and generate next task','saveReopen','primary'))}
function statusModal(){let l=currLead();return wrapModal('Change prospect outcome',l.company,
 `${dropdown('os_status','Outcome category',C.STATUSES.filter(x=>x!=='Active'),l.status==='Active'?'Negative Nurture':l.status)}${field('os_reason','Reason (required)','', 'textarea')}${field('os_date','Nurture review date (if relevant)',C.businessAdd(C.today(),60),'date')}${dropdown('os_scope','Take Me Off the List scope',[['contact','Contact only'],['company','Whole company']],'contact')}<div class="warning">Take Me Off the List immediately suppresses outreach. DQ = does not qualify; Closed Lost = qualified and chose not to proceed.</div>`,btn('Cancel','closeModal','ghost')+btn('Save outcome','saveStatus','primary'))}
function callModal(){let t=currTask(),{l,c}=cOf(t);if(!l)return '';return wrapModal('Log call outcome',`${l.company} · ${c?.name||'UNKNOWN CONTACT'}`,
 `<div class="badge-row">${stageTag(l)} ${readinessTag(l)}</div><label class="field"><span>What happened?</span><select id="call_outcome">${sel([['no_answer','No answer'],['gatekeeper','Gatekeeper / no decision-maker'],['connected','Meaningful conversation'],['callback','Callback requested'],['meeting_booked','Meeting booked'],['wrong_person','Wrong person / does not handle FX'],['bad_number','Bad / incorrect number'],['left_company','Person has left'],['negative_nurture','Negative nurture'],['disqualified','Disqualified (no viable FX)'],['closed_lost','Closed Lost (qualified, rejected solution)'],['optout','Take Me Off the List']],'no_answer')}</select></label><div id="call-more" class="call-more"><div class="two-cols compact">${field('call_minutes','Minutes (optional)',0,'number','min="0"')}${field('call_date','Agreed callback / meeting date','', 'date')}${field('call_time','Agreed time','', 'time')}</div>${field('call_notes','Call notes / what we learned','', 'textarea')}${field('call_reason','Objection / status reason','', 'textarea')}${field('call_referral','Who were you referred to? (if known)')}${dropdown('call_scope','Opt-out applies to',[['contact','This contact'],['company','Entire company']],'contact')}<section class="engaged-only" data-engaged><label class="check"><input id="call_decisionmaker" type="checkbox"> Confirmed I spoke with the person responsible for FX</label><div class="modal-section"><div class="card-head"><h3>Buyer Readiness (optional)</h3>${tag('Evidence required for changes','muted')}</div>${dropdown('call_readiness','Readiness after the call',[['','No change'],...C.READINESS.map((n,i)=>[String(i+1),`${i+1} · ${n}`])],'')}${field('call_evidence','Evidence for a change','', 'textarea')}${field('call_barrier','Main barrier',l.barrier,'textarea')}${field('call_milestone','Next desired buyer milestone',l.nextMilestone||unmet(l),'textarea')}</div><div class="info-card">You can save FX volumes, currency pairs, current pricing and spot/forwards from the Live FX Discovery panel without leaving this call unfinished.</div>${btn('Open Live FX Discovery','fxFromCall','outline')}</section></div>`,btn('Cancel','closeModal','ghost')+btn('Save outcome & next task','saveCall','primary'))}
function taskModal(){let t=currTask(),l=C.getLead(state,t?.leadId);if(!t)return '';if(t.type==='research')return repairModal();if(t.type==='call'||t.type==='callback')return callModal();
 return wrapModal('Complete task',l?.company||'GLOBAL TASK',`<div class="info-card"><b>${esc(t.title)}</b><p>${esc(t.objective||'Complete the action and record anything that changed.')}</p></div>${field('tk_notes','What did you do? What changed?', '', 'textarea')}${l&&['deal','meeting'].includes(t.type)?dropdown('tk_stage','Stage reached (only if actually achieved)',C.STAGES,l.stage):''}${field('tk_nextDate','Agreed next action date (optional)','', 'date')}${field('tk_nextTime','Time (optional)','', 'time')}<p class="muted small">Completing a task does not automatically improve Buyer Readiness. Log evidence separately if it changed.</p>`,btn('Cancel','closeModal','ghost')+btn('Complete & show next','saveTask','primary'))}
function repairModal(){let t=currTask(),l=currLead()||C.getLead(state,t?.leadId);if(!l)return '';return wrapModal('Resolve contact details',l.company,
 `<div class="info-card">${esc(t?.description||'Find the right person or a usable contact method.')}</div>${dropdown('repair_mode','What did you find?',[['new_number','Replacement number for an existing contact'],['new_contact','New contact / decision-maker'],['email','Use available email-only route'],['review','Still unresolved · review later']],'new_number')}${dropdown('repair_contact','Existing contact',l.contacts.length?l.contacts.map(c=>[c.id,c.name||c.title||'Contact']):[['','No contacts yet']],l.contacts[0]?.id||'')}${dropdown('repair_kind','New number type',[['mobile','Mobile'],['phone','Landline']],'mobile')}${field('repair_value','Replacement / new number')}${field('repair_name','New contact name')}${field('repair_title','New contact title')}${field('repair_email','New contact email','', 'email')}${field('repair_date','Review again on',C.businessAdd(C.today(),5),'date')}${field('repair_notes','Notes / verification source','', 'textarea')}<p class="muted small">Bad numbers remain marked invalid. The company stays qualified unless you separately choose DQ.</p>`,btn('Cancel','closeModal','ghost')+btn('Save resolution & next','saveRepair','primary'))}
function snoozeModal(){let t=currTask();return wrapModal('Reschedule task',t?.title||'TASK',`${t?.dueAt||''} ${t?.dueTime||''}`,
 `${field('sz_date','New due date',C.businessAdd(C.today(),1),'date')}${field('sz_time','Time (optional)',t?.dueTime||'', 'time')}<p class="muted small">Skipping or snoozing does not mark the task complete. Agreed commitments should only be rescheduled when genuinely rearranged.</p>`,btn('Cancel','closeModal','ghost')+btn('Save due date','saveSnooze','primary'))}
function manualModal(){let l=currLead();return wrapModal('Add a manual task',l?.company||'CHOOSE A COMPANY',
 `${dropdown('man_lead','Prospect',state.leads.filter(x=>C.active(x)).map(x=>[x.id,x.company]),l?.id||state.leads.find(x=>C.active(x))?.id||'')}${dropdown('man_type','Task type',[['call','Call'],['email','Email'],['deal','Deal progression'],['research','Find correct contact'],['manual','Other']], 'call')}${field('man_title','Task title')}${field('man_date','Due date',C.today(),'date')}${field('man_time','Due time (optional)','', 'time')}${field('man_objective','Why is this task useful?')}${field('man_success','What would count as progress?')}`,btn('Cancel','closeModal','ghost')+btn('Add task','saveManual','primary'))}
function loadFXDraft(){let l=currLead();if(!l)return;try{let saved=JSON.parse(localStorage.getItem('salesos.fxDraft.v3.'+l.id));fxDraft=saved&&Array.isArray(saved.flows)?saved:JSON.parse(JSON.stringify(l.fx))}catch{fxDraft=JSON.parse(JSON.stringify(l.fx))}}
function saveFXDraft(){let l=currLead();if(l&&fxDraft)try{localStorage.setItem('salesos.fxDraft.v3.'+l.id,JSON.stringify(fxDraft))}catch{}}
function fxModal(){let l=currLead();if(!fxDraft)loadFXDraft();if(!l)return '';let fx=fxDraft||l.fx;return wrapModal('Live FX Discovery',`${l.company} · AUTOSAVED DRAFT`,
 `<div class="info-card">Only fill fields the prospect actually gives you. Unknowns can stay blank. These details inform commercial insights but never automatically advance Buyer Readiness.</div><div class="two-cols compact">${field('fx_provider','Current FX provider',fx.provider||'','text','data-fx="provider"')}${field('fx_pricing','Current provider pricing (spread/fees, specify units)',fx.currentPricing||'','text','data-fx="currentPricing"')}${field('fx_hedgePct','Exposure currently hedged (%)',fx.hedgePct||'','number','min="0" max="100" data-fx="hedgePct"')}${field('fx_tenor','Typical forward tenor',fx.hedgeTenor||'','text','data-fx="hedgeTenor"')}${field('fx_timing','Payment frequency / next payment',fx.paymentTiming||'','text','data-fx="paymentTiming"')}${field('fx_budget','Budget rate, if applicable',fx.budgetRate||'','text','data-fx="budgetRate"')}</div><div class="field"><span>Products currently used</span><div class="checkbox-row">${['Spot','Forwards','Options'].map(x=>`<label class="check"><input type="checkbox" data-fx-product="${x}" ${fx.products?.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div>${field('fx_notes','Other discovery notes',fx.notes||'','textarea','data-fx="notes"')}<div class="modal-section"><div class="card-head"><h3>Currency flows</h3>${tag(`${fx.flows?.length||0} recorded`,'blue')}</div>${fx.flows?.map((f,i)=>`<div class="flow-row"><div><strong>${esc(f.pair||f.currency||'FX flow')}</strong><p class="muted small">${esc(f.direction||'Currency flow')} · ${esc(f.currency)} ${Number(f.amount||0).toLocaleString('en-GB')} ${esc(f.period||'annual')} · ${esc(f.confidence==='confirmed'?'Confirmed by prospect':'Estimate')}</p><small>Addressable ${f.addressablePct===''?'unknown':f.addressablePct+'%'} · margin ${f.marginBps===''?'assumed':f.marginBps+' bps'}</small></div>${btn('Remove','removeFlow','text',`data-index="${i}"`)}</div>`).join('')||'<p class="muted small">No volumes recorded yet. Add a flow when you learn a usable figure.</p>'}<div class="two-cols compact">${field('flow_pair','Currency pair (e.g. GBP/EUR)','','text','placeholder="GBP/EUR"')}${dropdown('flow_direction','Direction',[['buy','Buy foreign currency'],['sell','Sell foreign currency'],['both','Both / mixed'],['unknown','Unknown']],'unknown')}${field('flow_amount','Volume amount','','number','min="0" placeholder="2000000"')}${dropdown('flow_currency','Volume currency',['GBP','EUR','USD','AED','CHF','JPY','CAD','AUD'], 'GBP')}${dropdown('flow_period','Period',[['annual','Annually'],['monthly','Monthly'],['quarterly','Quarterly'],['weekly','Weekly']],'annual')}${dropdown('flow_confidence','Evidence',[['estimate','Estimated / approximate'],['confirmed','Prospect-confirmed']],'estimate')}${field('flow_gbp','Annual GBP equivalent (if not GBP)','','number','min="0" placeholder="Leave blank if unknown"')}${field('flow_addressable','Addressable share (%)','','number','min="0" max="100" placeholder="Unknown until confirmed"')}${field('flow_margin','Expected revenue margin (bps)','','number','min="0" placeholder="Blank = default assumption"')}</div>${btn('＋ Add currency flow','addFlow','outline full')}<p class="muted small">Amounts in different currencies are never added without a supplied GBP equivalent. Current-provider pricing is separate from the revenue margin you estimate you could earn.</p></div>`,btn('Save qualification & close','saveFX','primary')+btn('Close (keep draft)','closeModal','ghost'))}
function modalHtml(){if(dialog==='detail')return detailModal();if(dialog==='newCompany')return companyModal();if(dialog==='editCompany')return companyModal(true);if(dialog==='addContact'||dialog==='editContact')return contactModal();if(dialog==='readiness')return readinessModal();if(dialog==='stage')return stageModal();if(dialog==='status')return statusModal();if(dialog==='reopen')return reopenModal();if(dialog==='call')return callModal();if(dialog==='complete')return taskModal();if(dialog==='repair')return repairModal();if(dialog==='snooze')return snoozeModal();if(dialog==='manual')return manualModal();if(dialog==='fx')return fxModal();return ''}
function openModal(name,leadId=null,newTaskId=null){if(leadId!==null)detailId=leadId;if(newTaskId!==null)taskId=newTaskId;dialog=name;editingContactId=null;if(name==='fx')loadFXDraft();render();if(name==='call')updateCallPanels()}
function closeModal(){dialog=null;fxDraft=null;render()}
function showTask(t){if(!t)return;taskId=t.id;detailId=t.leadId;openModal(t.type==='call'||t.type==='callback'?'call':t.type==='research'?'repair':'complete',t.leadId,t.id)}
function updateCallPanels(){let out=val('call_outcome'),engaged=['connected','callback','meeting_booked','negative_nurture','closed_lost','disqualified'].includes(out);let block=$('call-more');if(block)block.classList.toggle('simple-call',out==='no_answer'||out==='gatekeeper');let content=document.querySelector('[data-engaged]');if(content)content.hidden=!engaged;let date=$('call_date')?.closest('.field'), time=$('call_time')?.closest('.field');let needDate=['callback','meeting_booked','connected','negative_nurture'].includes(out);if(date)date.style.display=needDate?'':'none';if(time)time.style.display=needDate?'':'none';let reason=$('call_reason')?.closest('.field');if(reason)reason.style.display=['negative_nurture','disqualified','closed_lost','optout'].includes(out)?'':'none';let referral=$('call_referral')?.closest('.field');if(referral)referral.style.display=out==='wrong_person'?'':'none';let scope=$('call_scope')?.closest('.field');if(scope)scope.style.display=out==='optout'?'':'none'}
function done(message='Saved'){save();dialog=null;fxDraft=null;tab='focus';render();toast(message)}
function saveCompany(){const name=val('co_company');if(!name)return toast('Company name required.',true);if(dialog==='editCompany'){let l=currLead();if(!l)return;let collision=state.leads.find(x=>x.id!==l.id&&C.companyKey(x.company)===C.companyKey(name));if(collision)return toast('A company with this name already exists.',true);if(l.status==='Take Me Off the List'&&C.companyKey(name)!==C.companyKey(l.company))return toast('Do not rename a suppressed company to bypass contact restrictions.',true);l.company=name;l.sector=val('co_sector');l.fit=C.clamp(val('co_fit'),1,5);l.notes=val('co_notes');save();openModal('detail',l.id);toast('Company updated');return}
 const result=C.createLead(state,{company:name,sector:val('co_sector'),fit:val('co_fit'),notes:val('co_notes'),contact:val('co_contact'),title:val('co_title'),mobile:val('co_mobile'),phone:val('co_phone'),email:val('co_email'),linkedin:val('co_linkedin')});if(result?.duplicate){openModal('detail',result.duplicate.id);return toast('Existing company opened rather than creating a duplicate.',true)}if(!result)return toast('Could not create company.',true);done('Prospect saved. Next task generated.')}
function saveContact(){let l=currLead();if(!l)return;let name=val('ct_name');if(!name)return toast('Enter a contact name.',true);let current=editingContactId?C.getContact(l,editingContactId):null;
 if(current){current.name=name;current.title=val('ct_title');current.roleStatus=val('ct_role');current.active=current.roleStatus!=='left_company';current.linkedinConnected=$('ct_connected')?.checked||false;current.notes=val('ct_notes');for(let type of ['mobile','phone','email','linkedin']){let v=val('ct_'+type);if(v){const old=current.methods.find(x=>x.kind===type&&x.value===v);if(!old){const res=C.addMethod(state,l,current,type,v);if(res?.duplicate){} }}}
 if(current.roleStatus==='not_responsible'||current.roleStatus==='left_company'){C.cancelTasks(state,l,t=>t.contactId===current.id&&['call','email','linkedin_connect','linkedin_message'].includes(t.type),'Contact cannot handle FX');C.addRepair(state,l,'Identify the actual FX decision-maker and find a usable contact method.',C.today(),current.id)}
 }else{let c=C.addContact(state,l,{name,title:val('ct_title'),roleStatus:val('ct_role'),mobile:val('ct_mobile'),phone:val('ct_phone'),email:val('ct_email'),linkedin:val('ct_linkedin'),linkedinConnected:$('ct_connected')?.checked,notes:val('ct_notes')});if(c?.duplicate)return toast('Contact already exists.',true);if(!c)return toast('Cannot save this contact.',true)}
 save();openModal('detail',l.id);toast('Contact details saved')}
function saveReadiness(){let l=currLead();if(!l)return;let level=val('rd_level'),evidence=val('rd_evidence'),barrier=val('rd_barrier'),milestone=val('rd_milestone');if(!level)return toast('Choose a readiness level.',true);
 if(Number(level)!==l.readiness){let r=C.setReadiness(state,l,Number(level),evidence,{barrier,nextMilestone:milestone});if(r.error)return toast(r.error,true)}else{l.barrier=barrier;l.nextMilestone=milestone||unmet(l);C.log(state,l,'Buyer Readiness','Barrier / next milestone reviewed',evidence,0)}
 save();openModal('detail',l.id);toast('Readiness and milestone saved')}
function saveStage(){let l=currLead(),stage=val('st_stage'),evidence=val('st_evidence');if(!l)return;
 if(stage!==l.stage&&!evidence)return toast('Record evidence for the stage progression.',true);
 if(stage!==l.stage){C.advanceStage(state,l,stage,evidence,val('st_nextDate'),val('st_nextTime'))}else C.log(state,l,'Pipeline','Stage reviewed',evidence,0);
 save();openModal('detail',l.id);toast('Pipeline milestone saved')}
function saveStatus(){let l=currLead(),st=val('os_status'),reason=val('os_reason');if(!l)return;if(!reason)return toast('Record the reason.',true);let c=C.preferredContact(l,'call')||l.contacts[0];const ok=C.changeStatus(state,l,st,reason,{due:val('os_date'),scope:val('os_scope'),contact:c});if(!ok)return toast('Could not update status.',true);save();openModal('detail',l.id);toast(st+' saved')}
function saveReopen(){let l=currLead();if(!l)return;let reason=val('reopen_reason');if(!reason)return toast('Record why the opportunity can be reopened.',true);let stage=val('reopen_stage');l.stage=stage;let ok=C.changeStatus(state,l,'Active',reason);if(!ok)return toast('The opportunity remains suppressed or cannot be reopened.',true);save();openModal('detail',l.id);toast('Opportunity reopened with a new next action')}
function saveCall(){let t=currTask();if(!t)return;const outcome=val('call_outcome');const opts={outcome,notes:val('call_notes'),decisionMakerConfirmed:!!$('call_decisionmaker')?.checked,minutes:val('call_minutes'),reason:val('call_reason'),referredName:val('call_referral'),callbackDate:val('call_date'),callbackTime:val('call_time'),optoutScope:val('call_scope'),barrier:val('call_barrier'),nextMilestone:val('call_milestone')};
 let r=val('call_readiness');if(r){opts.readiness=Number(r);opts.evidence=val('call_evidence')}
 let response=C.logCall(state,t,opts);if(response.error)return toast(response.error,true);done('Outcome logged · next task selected')}
function saveTask(){let t=currTask();if(!t)return;let l=C.getLead(state,t.leadId);let stage=val('tk_stage');if(l&&stage&&stage!==l.stage&&!val('tk_notes'))return toast('Explain what happened before advancing a stage.',true);
 let result=C.completeTask(state,t,{notes:val('tk_notes'),newStage:stage||undefined,nextDate:val('tk_nextDate'),nextTime:val('tk_nextTime')});if(result.error)return toast(result.error,true);done('Task completed · next task ready')}
function saveRepair(){let t=currTask();if(!t)return;let result=C.resolveContact(state,t,{mode:val('repair_mode'),contactId:val('repair_contact'),kind:val('repair_kind'),value:val('repair_value'),name:val('repair_name'),title:val('repair_title'),email:val('repair_email'),nextDate:val('repair_date'),notes:val('repair_notes')});if(result.error)return toast(result.error,true);done('Contact resolution updated')}
function saveSnooze(){let t=currTask();if(!t)return;if(!C.snoozeTask(state,t,val('sz_date'),val('sz_time')))return toast('Choose a due date.',true);done('Task rescheduled')}
function saveManual(){let l=C.getLead(state,val('man_lead'));if(!l)return toast('Choose an active company.',true);let type=val('man_type');let title=val('man_title');if(!title)return toast('Task title required.',true);
 let c=C.preferredContact(l,type==='call'?'call':type==='email'?'email':type);if(['call','email'].includes(type)&&!c){C.addRepair(state,l,`Find usable contact information before: ${title}`);done('Contact Resolution task created because no usable contact method exists');return}
 let m=type==='call'?C.anyPhone(c):type==='email'?C.bestMethod(c,'email'):null;
 C.addTask(state,l,type,title,val('man_date')||C.today(),{origin:'manual',dueTime:val('man_time'),contactId:c?.id,methodId:m?.id,objective:val('man_objective')||undefined,successCriteria:val('man_success'),isCommitment:false});done('Manual task created')}
function saveFX(){let l=currLead();if(!l||!fxDraft)return;C.updateFX(state,l,fxDraft);try{localStorage.removeItem('salesos.fxDraft.v3.'+l.id)}catch{}save();openModal('detail',l.id);toast('FX qualification saved')}
function addFlow(){if(!fxDraft)return;let n=C.num(val('flow_amount'));if(n<=0)return toast('Enter a positive currency volume.',true);let currency=val('flow_currency');let a=val('flow_addressable'),bps=val('flow_margin');if(a&&C.num(a)>100)return toast('Addressable share must be 0–100%.',true);
 fxDraft.flows.push({id:C.uid(),pair:val('flow_pair'),direction:val('flow_direction'),amount:n,currency,period:val('flow_period'),confidence:val('flow_confidence'),gbpAnnualEquivalent:val('flow_gbp')||'',addressablePct:a===''?'':C.num(a),marginBps:bps===''?'':C.num(bps)});saveFXDraft();render();toast('Flow added to locally saved draft')}
function exportBlob(filename,contents,type){let blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){exportBlob(`SalesOS_v3_backup_${C.today()}.json`,JSON.stringify(state,null,2),'application/json');toast('Full local backup downloaded')}
function csvCell(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){const heads=['company','sector','fit','stage','status','buyer_readiness','barrier','next_milestone','contact','title','mobile','phone','email','linkedin','notes'];const rows=[heads];for(let l of state.leads){let c=l.contacts[0]||{};rows.push([l.company,l.sector,l.fit,l.stage,l.status,l.readiness??'',l.barrier,l.nextMilestone,c.name||'',c.title||'',C.bestMethod(c,'mobile')?.value||'',C.bestMethod(c,'phone')?.value||'',C.bestMethod(c,'email')?.value||'',C.bestMethod(c,'linkedin')?.value||'',l.notes])}exportBlob(`SalesOS_v3_prospects_${C.today()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV downloaded (JSON backups preserve full activity history)')}
function parseCSV(raw){let out=[],row=[],cell='',quote=false;for(let i=0;i<raw.length;i++){const ch=raw[i];if(ch==='"'){if(quote&&raw[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(ch===','&&!quote){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&raw[i+1]==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()))out.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>String(x).trim()))out.push(row);return out}
function importCSV(text){let rows=parseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)return toast('No prospect rows detected.',true);let names=rows[0].map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,''));let get=(row,...alts)=>{let i=alts.map(x=>names.indexOf(x)).find(x=>x>=0);return i===undefined?'':str(row[i])};let added=0,merged=0,skipped=0;
 for(let row of rows.slice(1)){const company=get(row,'company','companyname','business','businessname');if(!company)continue;const contact=get(row,'contact','contactname','name');let existing=state.leads.find(x=>C.companyKey(x.company)===C.companyKey(company));let newContact={name:contact,title:get(row,'title','role','jobtitle'),mobile:get(row,'mobile','mobilenumber','directdial'),phone:get(row,'phone','telephone','landline'),email:get(row,'email','workemail'),linkedin:get(row,'linkedin','linkedinurl')};
 if(existing){if(contact&&!existing.contacts.some(x=>x.name.toLowerCase()===contact.toLowerCase())){C.addContact(state,existing,newContact);merged++}else skipped++;continue}
 // CSV intentionally does not import readiness or revive suppressed records; evidence must be confirmed in the app.
 const imported=C.createLead(state,{company,contact,sector:get(row,'sector','industry'),fit:get(row,'fit')||3,notes:get(row,'notes'),...newContact});if(imported&&!imported.duplicate)added++;
 }save();render();toast(`${added} companies added; ${merged} contacts merged; ${skipped} duplicate rows skipped.`)}
function importJSON(contents){let raw;try{raw=JSON.parse(contents)}catch{return toast('Invalid JSON file.',true)}let parsed=C.normalize(raw);if(!parsed)return toast('Not a compatible SalesOS v2 or v3 backup.',true);if(!confirm('Restore this backup and replace current v3 records? Export a backup first.'))return;state=parsed;save();dialog=null;tab='focus';render();toast(`Backup restored · ${state.leads.length} companies`)}
function requestUpload(type){let input=document.createElement('input');input.type='file';input.accept=type==='json'?'.json,application/json':'.csv,text/csv';input.style.display='none';document.body.append(input);input.addEventListener('change',()=>{let f=input.files[0];if(!f){input.remove();return}if(f.size>12*1024*1024){toast('File too large (12MB maximum)',true);input.remove();return}f.text().then(type==='json'?importJSON:importCSV).catch(()=>toast('Could not read file.',true)).finally(()=>input.remove())});input.click()}
function saveSettings(){for(let key of ['callGoal','taskGoal','meetingGoal','dailyCapacity','supplyDays','stalledAfterDays','defaultMarginBps','annualTarget']){let raw=val('s_'+key),n=C.num(raw,state.settings[key]);if(n<0)return toast('Settings cannot be negative.',true);state.settings[key]=n}save();render();toast('Targets saved')}
function captureSequence(){return [...document.querySelectorAll('.seq-row')].map(row=>({type:row.querySelector('.seq-type')?.value||'call',title:str(row.querySelector('.seq-title')?.value)||'Untitled action',delay:C.clamp(row.querySelector('.seq-delay')?.value,0,90)}))}
function saveSequence(){let steps=captureSequence();if(!steps.length)return toast('Add at least one sequence step.',true);state.sequence=steps;save();render();toast('Sequence template saved for new sequences')}

 {company:'Meridian Equipment Group Ltd',sector:'Wholesale equipment',contact:'Charlie Singh',title:'Financial Controller',mobile:'07700 900205',email:'charlie@meridian.example',fit:4,readiness:7,barrier:'Onboarding documents outstanding',stage:'Onboarding',fxVol:1800000,fxBps:40,addr:100},
 {company:'Atlas Workforce Services Ltd',sector:'Recruitment',contact:'Jamie Brooks',title:'Director',mobile:'07700 900206',email:'jamie@atlas.example',fit:3,readiness:1,barrier:'Not contacted yet',stage:'Prospecting',fxVol:0},
 {company:'Harbour Executive Search Ltd',sector:'International recruitment',contact:'Parker White',title:'CFO',mobile:'07700 900207',email:'parker@harbour.example',fit:4,readiness:5,barrier:'Decision-maker approval still needed',stage:'Meeting Booked',fxVol:1350000,fxBps:35,addr:70},
 {company:'Sterling Corporate Support Ltd',sector:'Professional services',contact:'Avery King',title:'MD',mobile:'07700 900208',email:'avery@sterling.example',fit:2,readiness:2,barrier:'Happy with incumbent',stage:'Prospecting',fxVol:0,status:'Negative Nurture'},

 for(let d of dataset){let x=C.createLead(state,{...d,status:'Active',readiness:d.readiness,readinessEvidence:d.readiness?'Fictional demonstration evidence':'',readinessUpdatedAt:d.readiness?C.addDays(C.today(),-20)+'T10:00:00':'',lastProgressAt:d.readiness?C.addDays(C.today(),-20)+'T10:00:00':'',nextMilestone:C.NEXT_MILESTONES[(d.readiness||1)-1]});if(!x||x.duplicate)continue;
 if(d.fxVol)C.updateFX(state,x,{provider:'Example incumbent bank',products:['Spot','Forwards'],currentPricing:'Not confirmed',hedgePct:'50',flows:[{id:C.uid(),pair:'GBP/EUR',direction:'buy',currency:'GBP',amount:d.fxVol,period:'annual',confidence:'confirmed',addressablePct:d.addr,marginBps:d.fxBps}]});
 if(d.status&&d.status!=='Active')C.changeStatus(state,x,d.status,d.status==='Disqualified'?'No currency exposure':'Not reviewing provider at present');
 }
 let company=state.leads.find(l=>l.company==='Northstar Talent Partners Ltd');if(company){C.cancelTasks(state,company,t=>t.origin==='stage','Demo override');C.scheduleCallback(state,company,C.today(),'','Fictional callback: revisit overseas-placement FX impact',company.contacts[0].id)}
 save();tab='focus';render();toast('Fictional demo loaded. All companies, numbers and emails are examples.')}
function generateInsights(which){let targets=which==='stalled'?C.insights(state).stalled.filter(x=>x.readiness===3):C.insights(state).noNext;let added=0;
 for(let l of targets){if(!C.active(l)||C.isSuppressed(state,l))continue;let found=state.tasks.find(t=>t.leadId===l.id&&t.status==='pending'&&t.isCommitment);if(found)continue;
 let t=C.addTask(state,l,'deal',which==='stalled'?'Revisit interested buyer milestone':'Establish next buyer milestone',C.today(),{origin:'insight',description:`Review current barrier: ${l.barrier||'Unknown'}`,objective:unmet(l),successCriteria:'A new evidence-backed buyer step or justified nurture decision',dedupeKey:`insight:${which}:${l.id}`});if(t)added++}
 save();render();toast(`${added} insight-driven tasks created or already scheduled`)}
async function copyMethod(target){let l=C.getLead(state,target.dataset.lead),c=C.getContact(l,target.dataset.contact),m=c?.methods.find(x=>x.id===target.dataset.method);if(!m||m.status==='invalid'||m.status==='blocked'||C.isSuppressed(state,l,c))return toast('Contact method unavailable or suppressed.',true);let value=['mobile','phone'].includes(m.kind)?C.phoneDial(m.value):m.value;
 try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(value);else{let el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();if(!document.execCommand('copy'))throw new Error('Clipboard unavailable');el.remove()}toast(`${m.kind==='email'?'Email':m.kind==='linkedin'?'LinkedIn URL':'Number'} copied to clipboard`)}catch(e){toast('Clipboard access blocked. Select and copy the displayed value manually.',true)}}
function openLinkedIn(target){let l=C.getLead(state,target.dataset.lead),c=C.getContact(l,target.dataset.contact),m=c?.methods.find(x=>x.id===target.dataset.method);if(!m||!C.bestMethod(c,'linkedin')||C.isSuppressed(state,l,c))return toast('LinkedIn link unavailable.',true);try{let url=new URL(m.value);if(!['https:','http:'].includes(url.protocol))throw new Error('Unsafe link');window.open(url.href,'_blank','noopener,noreferrer')}catch{toast('Invalid LinkedIn URL.',true)}}
function action(name,target){if(name==='overlayClose'){if(target.classList.contains('modal-overlay'))closeModal();return}
 if(name==='closeModal')return closeModal();if(name==='toggleNav'||name==='toggleSidebar'){sidebarHidden=!sidebarHidden;render();return}
 if(name.startsWith('go')){let route={goFocus:'focus',goTasks:'tasks',goInsights:'insights',goValue:'value',goPipeline:'pipeline'}[name];if(route){tab=route;dialog=null;render()}return}
 if(name==='newCompany')return openModal('newCompany');if(name==='reopen')return openModal('reopen',detailId);if(name==='detail')return openModal('detail',target.dataset.lead||getFocus()?.leadId);
 if(name==='editCompany')return openModal('editCompany',detailId);
 if(name==='addContact'){editingContactId=null;openModal('addContact',detailId);return}
 if(name==='editContact'){const cid=target.dataset.contact;openModal('editContact',detailId);editingContactId=cid;render();return}
 if(['readiness','stage','status'].includes(name))return openModal(name,dialog?detailId:(tab==='focus'?getFocus()?.leadId:detailId));
 if(name==='fx'||name==='fxFromCall'){let l=dialog?detailId:(tab==='focus'?getFocus()?.leadId:detailId);openModal('fx',l);return}
 if(name==='openTask'){let t=C.getTask(state,target.dataset.task);return showTask(t)}
 if(name==='toggleCallBlock'){callBlock=!callBlock;render();return}
 if(name==='copyMethod')return copyMethod(target);if(name==='openLinkedIn')return openLinkedIn(target);
 if(name==='invalidateMethod'){let l=C.getLead(state,target.dataset.lead),c=C.getContact(l,target.dataset.contact);if(!confirm('Mark this number invalid and prevent future calling tasks from using it?'))return;C.invalidateMethod(state,l,c,target.dataset.method);if(!C.preferredContact(l,'call'))C.addRepair(state,l,'All known numbers are invalid or unusable. Source another contact method.');save();openModal('detail',l.id);toast('Number marked invalid');return}
 if(name==='logCall'){let t=getFocus();if(!t||!['call','callback'].includes(t.type))return;return openModal('call',t.leadId,t.id)}
 if(name==='callOutcome'){let t=getFocus();if(!t||!['call','callback'].includes(t.type))return;openModal('call',t.leadId,t.id);const select=$('call_outcome');if(select){select.value=target.dataset.outcome||'no_answer';updateCallPanels()}return}
 if(name==='quickNoAnswer'){let t=getFocus();if(!t)return;let result=C.logCall(state,t,{outcome:'no_answer'});if(result.error)return toast(result.error,true);save();render();toast('No answer · follow-up scheduled, next task selected');return}
 if(name==='completeTask'||name==='resolveContact'){let t=dialog?currTask():getFocus();if(!t)return;return showTask(t)}
 if(name==='skipTask'){let t=getFocus();if(!t)return;if(t.isCommitment&&!confirm('This is a promised commitment. Skip until the next working day without completing it?'))return;C.skipTask(state,t);save();render();toast('Task deferred, not completed');return}
 if(name==='snooze'){let t=getFocus()||currTask();if(!t)return;return openModal('snooze',t.leadId,t.id)}
 if(name==='manualTask')return openModal('manual',detailId);
 if(name==='saveCompany')return saveCompany();if(name==='saveReopen')return saveReopen();if(name==='saveContact')return saveContact();if(name==='saveReadiness')return saveReadiness();if(name==='saveStage')return saveStage();if(name==='saveStatus')return saveStatus();if(name==='saveCall')return saveCall();if(name==='saveTask')return saveTask();if(name==='saveRepair')return saveRepair();if(name==='saveSnooze')return saveSnooze();if(name==='saveManual')return saveManual();if(name==='saveFX')return saveFX();if(name==='addFlow')return addFlow();
 if(name==='removeFlow'){if(!fxDraft)return;fxDraft.flows.splice(Number(target.dataset.index),1);saveFXDraft();render();return}
 if(name==='generateStalled')return generateInsights('stalled');if(name==='generateMissing')return generateInsights('missing');
 if(name==='createLeadgen'){const x=C.addTask(state,null,'leadgen','Find 10 more high-fit prospects',C.today(),{origin:'supply',description:'Add qualified companies so daily call supply does not run dry.',dedupeKey:'supply:leadgen'});save();tab='focus';render();toast(x?'Lead sourcing task available':'Lead sourcing task already queued');return}
 if(name==='saveSettings')return saveSettings();if(name==='exportJSON')return exportJSON();if(name==='exportCSV')return exportCSV();if(name==='importJSON')return requestUpload('json');if(name==='importCSV')return requestUpload('csv');if(name==='seedDemo')return seedDemo();
 if(name==='wipeData'){if(prompt('Type DELETE to clear the local v3 database:')!=='DELETE')return;state=C.newState();save();tab='focus';render();toast('v3 local records deleted. Existing v2 storage was not modified.');return}
 if(name==='saveSequence')return saveSequence();if(name==='addStep'){state.sequence=captureSequence();state.sequence.push({type:'call',title:'Additional contact attempt',delay:2});render();return}
 if(name==='removeStep'){state.sequence=captureSequence();if(state.sequence.length<=1)return toast('Keep at least one step.',true);state.sequence.splice(Number(target.dataset.index),1);render();return}
 if(name==='resetSequence'){if(!confirm('Reset the sequence template? This does not rewrite existing scheduled tasks.'))return;state.sequence=JSON.parse(JSON.stringify(C.STEPS));save();render();toast('Sequence template reset');return}
}
document.addEventListener('click',event=>{let t=event.target.closest('[data-action],[data-tab]');if(!t)return;if(t.tagName==='A')event.preventDefault();if(t.dataset.tab){tab=t.dataset.tab;dialog=null;render();return}action(t.dataset.action,t)});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='statusFilter'){statusFilter=t.value;render()}else if(t.id==='readinessFilter'){readinessFilter=t.value;render()}else if(t.id==='sortProspects'){sortProspects=t.value;render()}else if(t.id==='call_outcome'){updateCallPanels()}else if(t.hasAttribute('data-fx-product')){if(!fxDraft)return;let v=t.dataset.fxProduct;fxDraft.products=t.checked?[...new Set([...(fxDraft.products||[]),v])]:fxDraft.products.filter(x=>x!==v);saveFXDraft()}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='searchProspect'){let pos=t.selectionStart;searchTerm=t.value;render();let x=$('searchProspect');x?.focus();x?.setSelectionRange(pos,pos)}else if(t.hasAttribute('data-fx')){if(!fxDraft)return;fxDraft[t.dataset.fx]=t.value;saveFXDraft()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&dialog){closeModal();return}
 if(e.ctrlKey||e.metaKey||e.altKey||dialog||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;
 const key=e.key.toLowerCase();
 if(key==='m'){e.preventDefault();action('toggleSidebar',document.body);return}
 if(tab!=='focus')return;
 let t=getFocus();if(!t)return;
 if(key==='s'){e.preventDefault();action('skipTask',document.body);return}
 if(!['call','callback'].includes(t.type))return;
 if(key==='n'){e.preventDefault();action('quickNoAnswer',document.body);return}
 if(key==='g'){e.preventDefault();action('logCall',document.body);return}
 if(key==='w'||key==='b'){e.preventDefault();action('callOutcome',{dataset:{outcome:key==='w'?'wrong_person':'bad_number'}});return}
 if(key==='c'){let {l,c}=cOf(t),m=C.anyPhone(c);if(!m)return;e.preventDefault();copyMethod({dataset:{lead:l.id,contact:c.id,method:m.id}})}
});
render();
})();
