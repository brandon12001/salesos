name: salesos-reliability
services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_PASSWORD: local-test-only-password
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      retries: 30
  mail:
    image: inbucket/inbucket:3.1.0@sha256:194ac031a607fc9466b8882172f49854e75c4fad6772e18e2b4f4974cb87071b
    ports: ['127.0.0.1:55424:9000']
    healthcheck: {disable: true}
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55421
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-test-only-password@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:5273
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:5273/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: salesos-isolated-test-jwt-secret-at-least-thirty-two-characters
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@salesos.example
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: SalesOS local test
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
    ports: ['127.0.0.1:55429:9999']
  rest:
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    environment:
      PGRST_DB_URI: postgres://authenticator:local-test-only-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: salesos-isolated-test-jwt-secret-at-least-thirty-two-characters
    ports: ['127.0.0.1:55430:3000']
